app_key: simplia_agent_chat
repo: https://github.com/gruia-app/simplia-agent-chat.git
repo_owner: gruia-app
default_branch: main

stack:
  type: [node]

paths:
  root: .

ci:
  heavy_tests:
    enabled: true

commands:
  install:
    - node --version
    - npm --version
    - corepack enable
    - corepack prepare pnpm@9.0.0 --activate
    - pnpm install --frozen-lockfile
  lint: []
  typecheck: []
  test:
    - node --test --test-concurrency=1 scripts/pack-check.test.mjs
    - pnpm check
    - pnpm run test:git-consumer
  build: []
  e2e: []

# The repo's GitHub workflows verify and create signed GitHub releases. They do
# not deploy a running application; consumers pin reviewed Git commits.
# Jenkins shared-library source is pinned in Jenkinsfile to
# simplia-ci@c5d0854cfd25e3afecba7f51d39229bcd3f45ac8.
deploy:
  type: none

health:
  staging: []
  production: []

security:
  trivy: true
  severity: "HIGH,CRITICAL"
  fail_on_vulnerability: true
