app_key: simplia_agent_chat
repo: https://github.com/gruia-app/simplia-agent-chat.git
repo_owner: gruia-app
default_branch: main

stack:
  type: [node]

paths:
  root: .

ci:
  heavy_tests:
    enabled: true

commands:
  install:
    - node --version
    - npm --version
    - corepack enable
    - corepack prepare pnpm@9.0.0 --activate
    - pnpm install --frozen-lockfile
  lint: []
  typecheck: []
  test:
    - node --test --test-concurrency=1 scripts/pack-check.test.mjs
    - pnpm check
    # Install the published source head; synthetic merge commits stay local to Jenkins.
    - |
      SIMPLIA_AGENT_CHAT_GIT_REF="$(node -e '
        const { identity } = JSON.parse(require("node:fs").readFileSync(".simplia-ci/effective-manifest.json", "utf8"));
        const tested = require("node:child_process").execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
        if (identity.tested_sha !== tested) throw new Error("git_consumer_checkout_identity_mismatch");
        const revision = identity.head_sha ?? (!process.env.CHANGE_ID && !identity.identity_source ? identity.tested_sha : null);
        if (!/^[0-9a-f]{40}$/i.test(revision ?? "")) throw new Error("git_consumer_published_head_missing");
        process.stdout.write(revision);
      ')" &&
      export SIMPLIA_AGENT_CHAT_GIT_REF &&
      pnpm run test:git-consumer
  build: []
  e2e: []

# The repo's GitHub workflows verify and create signed GitHub releases. They do
# not deploy a running application; consumers pin reviewed Git commits.
# Jenkins shared-library source is pinned in Jenkinsfile to
# simplia-ci@c5d0854cfd25e3afecba7f51d39229bcd3f45ac8.
deploy:
  type: none

health:
  staging: []
  production: []

security:
  trivy: true
  severity: "HIGH,CRITICAL"
  fail_on_vulnerability: true
