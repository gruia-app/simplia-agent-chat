[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gruia-agent-tools"
version = "2.0.0a0"
description = "Server-side library for the chat-centric ToolSpec/Proposal contract (SPEC-CHAT-F1-R687 rev 3): tool registry, proposal store, apply tokens, idempotency, audit outbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema>=4.21",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["gruia_agent_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
